openapi: 3.1.0
info:
  title: Werkt API
  version: 1.2.0
  description: Agent-facing management API and trigger ingress for Werkt automations.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Control plane and database are available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                  version: {type: string}
                  commit: {type: string}
                  builtAt: {type: string}
                  dirty: {type: boolean}
                required: [status, version, commit, builtAt, dirty]
        "503": {$ref: "#/components/responses/Error"}
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Control plane and database are ready to serve requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                  version: {type: string}
                  commit: {type: string}
                  builtAt: {type: string}
                  dirty: {type: boolean}
                required: [status, version, commit, builtAt, dirty]
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/auth/session:
    get:
      operationId: getBrowserSession
      description: Reports whether Authelia browser login is configured and whether the current encrypted session cookie is authenticated.
      responses:
        "200":
          description: Browser authentication state. The CSRF token is present only for an authenticated session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserSession"}
  /api/v1/auth/login:
    get:
      operationId: startBrowserLogin
      description: Starts an OIDC authorization-code flow with PKCE and redirects to Authelia.
      responses:
        "302": {description: Redirect to the configured OIDC provider.}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/auth/callback:
    get:
      operationId: completeBrowserLogin
      description: Verifies the OIDC response and establishes an encrypted HttpOnly browser session.
      responses:
        "302": {description: Redirect to the workspace with either a session or a safe error code.}
  /api/v1/auth/logout:
    post:
      operationId: endBrowserSession
      security: [{BrowserSession: []}]
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200": {description: Browser session cleared.}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/automations:
    get:
      operationId: listAutomations
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Project"}
        - {$ref: "#/components/parameters/Folder"}
        - {$ref: "#/components/parameters/Label"}
        - name: q
          in: query
          schema: {type: string}
        - name: enabled
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: Organized automation inventory.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AutomationSummary"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/automations/{automation}:
    parameters:
      - {$ref: "#/components/parameters/AutomationID"}
    get:
      operationId: getAutomation
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Active manifest, effective triggers, and revision history.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomationDetail"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      operationId: setAutomationEnabled
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Actor"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
              required: [enabled]
      responses:
        "200":
          description: Updated lifecycle state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  automation: {$ref: "#/components/schemas/AutomationDetail"}
                  changed: {type: boolean}
                required: [automation, changed]
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/automations/{automation}/runs:
    post:
      operationId: queueManualRun
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AutomationID"}
        - {$ref: "#/components/parameters/Actor"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/ExpectedRevision"}
      requestBody:
        description: JSON event data, limited to 2 MiB.
        content:
          application/json:
            schema: {}
      responses:
        "202": {$ref: "#/components/responses/RunQueued"}
        "200": {$ref: "#/components/responses/RunQueued"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/automations/{automation}/rollback:
    post:
      operationId: rollbackAutomation
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AutomationID"}
        - {$ref: "#/components/parameters/Actor"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revisionId: {type: string}
              required: [revisionId]
      responses:
        "200":
          description: The selected immutable revision is active; repeated requests are no-ops.
          content:
            application/json:
              schema:
                type: object
                properties:
                  automation: {$ref: "#/components/schemas/AutomationDetail"}
                  changed: {type: boolean}
                required: [automation, changed]
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments:
    post:
      operationId: createDeployment
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Actor"}
        - name: Idempotency-Key
          in: header
          required: true
          description: Replay key for this deployment request. Reuse with a different package digest returns 409.
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: X-Werkt-Content-SHA256
          in: header
          required: true
          description: Expected lowercase hexadecimal SHA-256 digest of the exact compressed request body.
          schema: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
      requestBody:
        required: true
        description: Gzip-compressed tar archive rooted at automation.yaml. Compressed, expanded, and entry-count limits are configured by the server.
        content:
          application/gzip:
            schema: {type: string, format: binary}
      responses:
        "202": {$ref: "#/components/responses/DeploymentAccepted"}
        "200": {$ref: "#/components/responses/DeploymentAccepted"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      operationId: listDeployments
      security: [{BearerAuth: []}]
      parameters:
        - name: automation
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [queued, validating, building, checking, activating, succeeded, failed, cancelled]}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Deployment jobs newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Deployment"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/{deployment}:
    get:
      operationId: getDeployment
      security: [{BearerAuth: []}]
      parameters:
        - name: deployment
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Current deployment lifecycle and diagnostics. Nonterminal responses include Retry-After.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/{deployment}/cancel:
    post:
      operationId: cancelDeployment
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DeploymentID"}
        - {$ref: "#/components/parameters/Actor"}
      responses:
        "200":
          description: Cancellation was recorded. Active work stops cooperatively and remains pollable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/deployments/{deployment}/retry:
    post:
      operationId: retryDeployment
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DeploymentID"}
        - {$ref: "#/components/parameters/Actor"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202": {$ref: "#/components/responses/DeploymentAccepted"}
        "200": {$ref: "#/components/responses/DeploymentAccepted"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/retention/plans:
    post:
      operationId: createRetentionPlan
      description: Creates a persisted dry-run plan. No storage is deleted until the plan is explicitly applied.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Actor"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RetentionPolicy"}
      responses:
        "201":
          description: A retention plan that remains valid for 15 minutes.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionPlan"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/retention/plans/{plan}:
    get:
      operationId: getRetentionPlan
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RetentionPlanID"}
      responses:
        "200":
          description: Persisted plan, candidates, and execution outcomes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionPlan"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/retention/plans/{plan}/apply:
    post:
      operationId: applyRetentionPlan
      description: Revalidates every planned item, detaches eligible database references, and deletes the owned storage.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RetentionPlanID"}
        - {$ref: "#/components/parameters/Actor"}
      responses:
        "200":
          description: Applied plan. Repeated apply requests return the same terminal result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RetentionPlan"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
  /api/v1/secrets:
    get:
      operationId: listSecrets
      description: Lists encrypted secret metadata. Values and ciphertext are never returned.
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Secret inventory ordered by hierarchical name.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SecretMetadata"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/secrets/{secret}:
    parameters:
      - {$ref: "#/components/parameters/SecretName"}
    get:
      operationId: getSecret
      description: Returns metadata only; Werkt has no management endpoint that reveals a secret value.
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Secret metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretMetadata"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    put:
      operationId: putSecret
      description: Creates or rotates an encrypted secret. Repeating the name creates a new version.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Actor"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                value: {type: string, minLength: 8, maxLength: 65536, writeOnly: true}
                description: {type: string, maxLength: 500}
              required: [value]
      responses:
        "200":
          description: Existing secret rotated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretMetadata"}
        "201":
          description: Secret created.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretMetadata"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSecret
      description: Deletes an unreferenced secret. Any retained revision binding causes a conflict.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Actor"}
      responses:
        "204": {description: Secret deleted.}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/runs:
    get:
      operationId: listRuns
      security: [{BearerAuth: []}]
      parameters:
        - name: automation
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [queued, running, succeeded, failed]}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Runs newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/runs/{run}:
    get:
      operationId: getRun
      security: [{BearerAuth: []}]
      parameters:
        - name: run
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: One run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      security: [{BearerAuth: []}]
      parameters:
        - name: automation
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Audit events newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEvent"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/hooks/{automation}/{trigger}:
    post:
      operationId: ingestWebhook
      security: [{WebhookHMAC: []}]
      parameters:
        - {$ref: "#/components/parameters/AutomationID"}
        - {$ref: "#/components/parameters/TriggerID"}
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique replay key, included in the signed message.
          schema: {type: string, maxLength: 255}
        - name: X-Werkt-Timestamp
          in: header
          required: true
          description: Current Unix timestamp in seconds; accepted within five minutes and included in the signed message.
          schema: {type: string, pattern: "^[0-9]+$"}
        - name: X-Werkt-Signature
          in: header
          required: true
          description: HMAC-SHA256 of <timestamp>.<idempotency-key>.<exact body> as sha256=<lowercase hex>. A trigger may configure a different header name.
          schema: {type: string}
      requestBody:
        description: JSON or raw event body, limited to 2 MiB.
        content:
          application/json:
            schema: {}
      responses:
        "202": {$ref: "#/components/responses/RunQueued"}
        "200": {$ref: "#/components/responses/RunQueued"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/email/{automation}/{trigger}:
    post:
      operationId: ingestEmail
      security: [{EmailIngressBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/AutomationID"}
        - {$ref: "#/components/parameters/TriggerID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        description: RFC 5322 message, limited to 12 MiB.
        content:
          message/rfc822:
            schema: {type: string, format: binary}
      responses:
        "202": {$ref: "#/components/responses/RunQueued"}
        "200": {$ref: "#/components/responses/RunQueued"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    BrowserSession:
      type: apiKey
      in: cookie
      name: werkt_session
      description: Encrypted HttpOnly OIDC session used by the embedded workspace. Unsafe requests also require X-Werkt-CSRF.
    WebhookHMAC:
      type: apiKey
      in: header
      name: X-Werkt-Signature
      description: Per-trigger HMAC-SHA256 signature; secret value is resolved from the manifest's secret reference.
    EmailIngressBearer:
      type: http
      scheme: bearer
      description: Per-trigger bearer token resolved from the manifest's tokenSecret reference.
  parameters:
    AutomationID:
      name: automation
      in: path
      required: true
      schema: {type: string}
    DeploymentID:
      name: deployment
      in: path
      required: true
      schema: {type: string}
    RetentionPlanID:
      name: plan
      in: path
      required: true
      schema: {type: string}
    SecretName:
      name: secret
      in: path
      required: true
      description: Lowercase hierarchical name. Clients percent-encode slashes inside the path segment.
      schema:
        type: string
        maxLength: 128
        pattern: "^[a-z][a-z0-9]*(?:[._/-][a-z0-9]+)*$"
    TriggerID:
      name: trigger
      in: path
      required: true
      schema: {type: string}
    Actor:
      name: X-Werkt-Actor
      in: header
      description: Caller-supplied audit attribution; defaults to api.
      schema: {type: string, maxLength: 255}
    CSRFToken:
      name: X-Werkt-CSRF
      in: header
      required: true
      description: Session-bound CSRF token returned by GET /api/v1/auth/session.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
    ExpectedRevision:
      name: X-Werkt-Expected-Revision
      in: header
      description: Optional active revision precondition. A mismatch returns 409 without queueing a run.
      schema: {type: string}
    Project:
      name: project
      in: query
      schema: {type: string}
    Folder:
      name: folder
      in: query
      schema: {type: string}
    Label:
      name: label
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RunQueued:
      description: Run was newly queued or an idempotent retry found the existing run.
      content:
        application/json:
          schema:
            type: object
            properties:
              runId: {type: string}
              created: {type: boolean}
            required: [runId, created]
    DeploymentAccepted:
      description: Deployment was accepted or an idempotent retry found the existing deployment.
      headers:
        Location:
          schema: {type: string}
        Retry-After:
          schema: {type: string}
      content:
        application/json:
          schema:
            type: object
            properties:
              deployment: {$ref: "#/components/schemas/Deployment"}
              created: {type: boolean}
            required: [deployment, created]
  schemas:
    BrowserSession:
      type: object
      properties:
        configured: {type: boolean}
        authenticated: {type: boolean}
        identity:
          type: object
          properties:
            email: {type: string, format: email}
            name: {type: string}
            username: {type: string}
        csrfToken: {type: string}
        expiresAt: {type: string, format: date-time}
      required: [configured, authenticated]
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
    AutomationSummary:
      type: object
      properties:
        id: {type: string}
        project: {type: string}
        folder: {type: string}
        description: {type: string}
        labels: {type: array, items: {type: string}}
        enabled: {type: boolean}
        activeRevisionId: {type: string}
        updatedAt: {type: string, format: date-time}
        latestRun:
          type: object
          properties:
            id: {type: string}
            status: {type: string, enum: [queued, running, succeeded, failed]}
            createdAt: {type: string, format: date-time}
          required: [id, status, createdAt]
      required: [id, project, labels, enabled, activeRevisionId, updatedAt]
    AutomationDetail:
      allOf:
        - {$ref: "#/components/schemas/AutomationSummary"}
        - type: object
          properties:
            manifest: {type: object, additionalProperties: true}
            triggers:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  type: {type: string}
                  enabled: {type: boolean}
                  config: {type: object, additionalProperties: true}
                  nextFireAt: {type: string, format: date-time}
                required: [id, type, enabled, config]
            revisions:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  contentHash: {type: string}
                  active: {type: boolean}
                  provenance: {$ref: "#/components/schemas/ArtifactProvenance"}
                  createdAt: {type: string, format: date-time}
                required: [id, contentHash, active, createdAt]
          required: [manifest, triggers, revisions]
    Run:
      type: object
      properties:
        id: {type: string}
        automationId: {type: string}
        revisionId: {type: string}
        eventId: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        attempt: {type: integer}
        maxAttempts: {type: integer}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        logs: {type: string}
        error: {type: string}
        result: {}
      required: [id, automationId, revisionId, eventId, status, attempt, maxAttempts, createdAt]
    Deployment:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, validating, building, checking, activating, succeeded, failed, cancelled]}
        automationId: {type: string}
        packageDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        contentHash: {type: string, pattern: "^[a-f0-9]{64}$"}
        revisionId: {type: string}
        retryOf: {type: string}
        actor: {type: string}
        error: {type: string}
        provenance: {$ref: "#/components/schemas/ArtifactProvenance"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/DeploymentStep"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        cancelRequestedAt: {type: string, format: date-time}
      required: [id, status, packageDigest, actor, createdAt, updatedAt]
    ArtifactProvenance:
      type: object
      additionalProperties: false
      properties:
        version: {type: integer, const: 1}
        artifactDigest: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        contentHash: {type: string, pattern: "^[a-f0-9]{64}$"}
        automationId: {type: string}
        runtimeImage: {type: string}
        buildImage: {type: string}
        algorithm: {type: string, const: ed25519}
        signingKeyId: {type: string, pattern: "^sha256:[a-f0-9]{64}$"}
        publicKey: {type: string}
        signature: {type: string}
      required: [version, artifactDigest, contentHash, automationId, algorithm, signingKeyId, publicKey, signature]
    DeploymentStep:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [validate, build, check, activate]}
        status: {type: string, enum: [running, succeeded, failed]}
        logs: {type: string}
        error: {type: string}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
      required: [id, kind, status, startedAt]
    RetentionPolicy:
      type: object
      additionalProperties: false
      properties:
        sourceMaxAge:
          type: string
          default: 720h
          description: Positive Go duration. Terminal sources newer than this remain protected.
        artifactMaxAge:
          type: string
          default: 2160h
          description: Positive Go duration. Inactive artifacts newer than this remain protected.
        keepRetryableSources:
          type: integer
          minimum: 0
          maximum: 10000
          default: 3
        keepInactiveRevisions:
          type: integer
          minimum: 0
          maximum: 10000
          default: 5
    RetentionPlan:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [planned, applying, applied]}
        policy: {$ref: "#/components/schemas/RetentionPolicy"}
        summary: {$ref: "#/components/schemas/RetentionSummary"}
        items:
          type: array
          items: {$ref: "#/components/schemas/RetentionItem"}
        actor: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        appliedAt: {type: string, format: date-time}
      required: [id, status, policy, summary, items, actor, createdAt, expiresAt]
    RetentionSummary:
      type: object
      properties:
        items: {type: integer}
        estimatedBytes: {type: integer, format: int64}
        deleted: {type: integer}
        skipped: {type: integer}
        failed: {type: integer}
      required: [items, estimatedBytes, deleted, skipped, failed]
    RetentionItem:
      type: object
      properties:
        position: {type: integer}
        kind: {type: string, enum: [source, artifact]}
        storageKey: {type: string}
        resourceIds: {type: array, items: {type: string}}
        automationIds: {type: array, items: {type: string}}
        reason: {type: string}
        estimatedBytes: {type: integer, format: int64}
        status: {type: string, enum: [planned, deleted, skipped, failed]}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        deletedAt: {type: string, format: date-time}
      required: [position, kind, storageKey, resourceIds, reason, estimatedBytes, status, createdAt]
    SecretMetadata:
      type: object
      description: Safe metadata. Secret values and ciphertext never appear in responses.
      properties:
        name: {type: string}
        description: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [name, version, createdAt, updatedAt]
    AuditEvent:
      type: object
      properties:
        id: {type: string}
        action: {type: string}
        automationId: {type: string}
        actor: {type: string}
        details: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
      required: [id, action, automationId, actor, details, createdAt]
