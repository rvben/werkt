apiVersion: werkt.dev/v1
kind: Automation

metadata:
  name: go-hello
  project: examples
  folder: getting-started
  description: Demonstrates the raw protocol from a Go binary.
  labels: [go, example]

triggers:
  - id: incoming
    type: webhook
    config:
      secret: examples/go-hello/webhook

runtime:
  language: go
  image: debian@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
  buildImage: golang@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3b3fbba0aea53d2
  build: [go, build, -o, go-hello, .]
  command: [./go-hello]
  secrets:
    EXAMPLE_SERVICE_TOKEN: examples/go-hello/service-token

deployment:
  checks:
    - id: unit
      command: [go, test, ./...]
      timeout: 2m

execution:
  timeout: 30s
  retries: 1
