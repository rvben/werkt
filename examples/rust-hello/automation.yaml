apiVersion: werkt.dev/v1
kind: Automation

metadata:
  name: rust-hello
  project: examples
  folder: getting-started
  description: Demonstrates the same process protocol from a compiled Rust binary.
  labels: [rust, example]

triggers:
  - id: incoming
    type: webhook
    config:
      secret: examples/rust-hello/webhook

  - id: ntfy-example
    type: ntfy
    enabled: false
    config:
      server: https://ntfy.sh
      topic: replace-with-a-private-topic

runtime:
  language: rust
  image: debian@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
  buildImage: rust@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
  build: [cargo, build, --release]
  command: [./target/release/rust-hello]
  environment:
    RUST_BACKTRACE: "1"

deployment:
  checks:
    - id: unit
      command: [cargo, test, --release]
      timeout: 5m

execution:
  timeout: 30s
  retries: 1
  concurrency: allow
