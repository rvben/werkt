apiVersion: werkt.dev/v1
kind: Automation

metadata:
  name: python-hello
  project: examples
  folder: getting-started
  description: Demonstrates schedule and webhook triggers with Python.
  labels: [python, example]

triggers:
  - id: every-minute
    type: schedule
    config:
      cron: "* * * * *"
      timezone: Europe/Amsterdam

  - id: incoming
    type: webhook
    config:
      secret: examples/python-hello/webhook

  - id: mail
    type: email
    config:
      tokenSecret: examples/python-hello/email

runtime:
  language: python
  tools:
    python: 3.13.7
  command: [python3, main.py]

deployment:
  checks:
    - id: syntax
      command: [python3, -m, py_compile, main.py]
      timeout: 30s

execution:
  timeout: 30s
  retries: 2
  concurrency: forbid
