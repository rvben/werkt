---
# Immutable action SHAs intentionally exceed the default YAML line limit.
# yamllint disable rule:line-length
name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: werkt_test
          POSTGRES_USER: werkt_test
          POSTGRES_PASSWORD: werkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkt_test -d werkt_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      WERKT_TEST_DATABASE_URL: >-
        postgres://werkt_test:werkt_test@127.0.0.1:5432/werkt_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a semantic version on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release source
        run: |
          ./scripts/check-workflow-security.sh
          ./scripts/check-public-safety.sh --history
          go vet ./...
          go test ./... -count=1
          WERKT_BROWSER_TESTS=1 go test ./internal/httpapi \
            -run TestWorkspaceBrowserKeyboardFocusAndResponsiveModality -count=1
          PYTHONPATH=sdk/python python3 -m unittest discover \
            -s sdk/python/tests -v
          cargo test --locked --manifest-path sdk/rust/Cargo.toml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build reproducible archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          archive="werkt-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          built_at=$(git show -s --format=%cI "$GITHUB_SHA")
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          mkdir -p "dist/$archive"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/rvben/werkt/internal/buildinfo.Version=$GITHUB_REF_NAME \
              -X github.com/rvben/werkt/internal/buildinfo.Commit=$GITHUB_SHA \
              -X github.com/rvben/werkt/internal/buildinfo.BuiltAt=$built_at" \
            -o "dist/$archive/werkt" ./cmd/werkt
          go version -m "dist/$archive/werkt"
          if [[ $GOOS == linux && $GOARCH == amd64 ]]; then
            "dist/$archive/werkt" version | grep -Fx "$GITHUB_REF_NAME"
          fi
          cp LICENSE README.md "dist/$archive/"
          tar --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner \
            -C dist -czf "dist/$archive.tar.gz" "$archive"
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum werkt-*.tar.gz > SHA256SUMS
      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - name: Publish release atomically
        run: |
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Werkt $GITHUB_REF_NAME" \
            --generate-notes \
            release/werkt-*.tar.gz release/SHA256SUMS
          asset_count=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [[ $asset_count -ne 5 ]]; then
            echo "draft release has $asset_count assets; expected 5" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
