name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WERKT_EXPECTED_ENVIRONMENT: staging
  WERKT_EXPECTED_INSTANCE: staging-control

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: werkt_test
          POSTGRES_USER: werkt_test
          POSTGRES_PASSWORD: werkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkt_test -d werkt_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      WERKT_TEST_DATABASE_URL: postgres://werkt_test:werkt_test@127.0.0.1:5432/werkt_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify
        run: |
          go vet ./...
          go test ./... -count=1
          WERKT_BROWSER_TESTS=1 go test ./internal/httpapi -run TestWorkspaceBrowserKeyboardFocusAndResponsiveModality -count=1
          ./scripts/check-public-safety.sh --history
      - name: Build immutable release
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X github.com/rvben/werkt/internal/config.TargetEnvironment=$WERKT_EXPECTED_ENVIRONMENT -X github.com/rvben/werkt/internal/config.TargetInstance=$WERKT_EXPECTED_INSTANCE" \
            -o dist/werkt ./cmd/werkt
          git rev-parse HEAD > dist/commit
          cp scripts/staging-smoke.sh dist/staging-smoke.sh
          chmod 0755 dist/werkt dist/staging-smoke.sh
          (cd dist && sha256sum werkt > werkt.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: werkt-staging-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, staging-control]
    environment:
      name: staging
      url: ${{ vars.WERKT_STAGING_URL }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: werkt-staging-${{ github.run_id }}
          path: release
      - name: Verify and prepare release
        working-directory: release
        run: |
          sha256sum --check werkt.sha256
          # GitHub artifacts intentionally normalize file modes on download.
          chmod 0755 werkt staging-smoke.sh
      - name: Install with automatic readiness rollback
        run: |
          commit=$(tr -d '\n' < release/commit)
          sudo /usr/local/sbin/install-werkt-release "$PWD/release/werkt" "$commit"
      - name: Smoke test protected staging
        env:
          WERKT_STAGING_URL: ${{ vars.WERKT_STAGING_URL }}
        run: |
          export WERKT_EXPECTED_COMMIT
          WERKT_EXPECTED_COMMIT=$(tr -d '\n' < release/commit)
          release/staging-smoke.sh
          sudo /usr/local/sbin/verify-werkt-staging "$WERKT_EXPECTED_COMMIT"
