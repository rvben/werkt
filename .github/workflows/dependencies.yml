name: Dependency health

on:
  schedule:
    - cron: "14 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b183939ff7dc62539afb00b3c555ffbfe3c5d58b # v0.18.2
    with:
      langs: go,rust,python,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy,rustfmt &&
        rustup default stable
      validation-command: >-
        ./scripts/check-workflow-security.sh &&
        go vet ./... &&
        go test ./... -count=1 &&
        cargo test --manifest-path sdk/rust/Cargo.toml --locked &&
        cargo test --manifest-path examples/rust-hello/Cargo.toml --locked &&
        python3 -m compileall sdk/python
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/workflows/*.yaml
        .github/workflows/*.yml
        examples/go-hello/go.mod
        examples/rust-hello/Cargo.lock
        examples/rust-hello/Cargo.toml
        go.mod
        go.sum
        sdk/python/pyproject.toml
        sdk/rust/Cargo.lock
        sdk/rust/Cargo.toml
