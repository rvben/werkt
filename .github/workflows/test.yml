name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: werkt_test
          POSTGRES_USER: werkt_test
          POSTGRES_PASSWORD: werkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkt_test -d werkt_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      WERKT_TEST_DATABASE_URL: postgres://werkt_test:werkt_test@127.0.0.1:5432/werkt_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check workflow security
        run: ./scripts/check-workflow-security.sh
      - name: Test Python SDK
        env:
          PYTHONPATH: sdk/python
        run: python3 -m unittest discover -s sdk/python/tests -v
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Verify Chrome availability
        run: command -v google-chrome
      - name: Test workspace browser contract
        env:
          WERKT_BROWSER_TESTS: "1"
        run: go test ./internal/httpapi -run TestWorkspaceBrowserKeyboardFocusAndResponsiveModality -count=1
